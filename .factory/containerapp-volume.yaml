properties:
  template:
    containers:
      - name: app
        image: IMAGE_PLACEHOLDER
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: PORT
            value: "8080"
          - name: DATA_DIR
            value: /tmp/client-action-room
          - name: PERSIST_DIR
            value: /data
        volumeMounts:
          - volumeName: data
            mountPath: /data
    scale:
      minReplicas: 1
      maxReplicas: 1
    volumes:
      - name: data
        storageType: AzureFile
        storageName: client-action-room-data
