properties:
  template:
    containers:
      - name: app
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: PORT
            value: "8080"
          - name: DATA_DIR
            value: /data
        volumeMounts:
          - volumeName: data
            mountPath: /data
    scale:
      minReplicas: 1
      maxReplicas: 1
    volumes:
      - name: data
        storageType: AzureFile
        storageName: client-action-room-data
